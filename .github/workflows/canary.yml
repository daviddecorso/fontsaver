name: Daily Canary

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  canary:
    name: Live Google Fonts Canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Chrome MV3 extension
        run: pnpm build

      - name: Run live site canary test
        run: pnpm run test:e2e
        env:
          CI: "true"

      - name: File issue on canary failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Canary Alert: fonts.google.com DOM change detected';
            const body = `### Automated Canary Failure
            The daily live canary test against \`https://fonts.google.com\` failed on [Run #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).

            This failure indicates that Google may have redesigned the \`fonts.google.com\` layout or modified specimen link structures.

            **Please review:**
            - \`entrypoints/google-fonts.content/selectors.ts\`
            - \`tests/fixtures/fonts-google/\`
            - Playwright test artifacts & traces
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
            });

            const existing = issues.data.find(issue => issue.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'canary'],
              });
            }

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-canary-report
          path: playwright-report/
          retention-days: 7
